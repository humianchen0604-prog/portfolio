<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lava Memory Icons</title>
<style>
  :root {
    --bg: #f3ede0;
    --card: #faf6ec;
    --ink: #161513;
    --muted: #6f6a60;
    --line: #e2dacb;
    --tile-bg: #161513;
    --tile-ink: #f3ede0;
  }
  body[data-bg="white"] { --bg: #ffffff; --card: #ffffff; --line: #ececec; }
  body[data-bg="ink"] {
    --bg: #0d0d0c; --card: #151513; --ink: #f2eee4; --muted: #8f8a80; --line: #26251f;
    --tile-bg: #f2eee4; --tile-ink: #0d0d0c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: background .2s, color .2s;
  }
  header { max-width: 1240px; margin: 0 auto; padding: 48px 16px 8px; }
  h1 { font-size: 34px; letter-spacing: -0.02em; margin: 0 0 6px; font-weight: 650; }
  header p { margin: 0; color: var(--muted); max-width: 62ch; }
  .controls { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 22px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .seg button {
    font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0;
    padding: 5px 13px; border-radius: 999px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
  .grid {
    max-width: 1240px; margin: 0 auto; padding: 24px 16px 64px;
    display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  }
  .card {
    margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
  }
  .card[hidden] { display: none; }
  .stage { aspect-ratio: 1; display: grid; place-items: center; }
  .stage svg { width: 74%; height: 74%; fill: var(--ink); }
  .sizes { display: flex; align-items: center; gap: 14px; padding: 2px 4px; }
  .sizes svg { display: block; width: 100%; height: 100%; fill: var(--ink); }
  .tile { width: 52px; height: 52px; border-radius: 12px; background: var(--tile-bg); padding: 9px; }
  .tile svg { fill: var(--tile-ink); }
  .s32 { width: 32px; height: 32px; }
  .s16 { width: 16px; height: 16px; }
  figcaption { font-size: 13px; color: var(--muted); padding: 0 4px; }
  figcaption b { color: var(--ink); font-size: 15px; font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  .title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
  .title b { white-space: nowrap; }
  .tag {
    margin-left: auto; white-space: nowrap; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px;
  }
  figcaption p { margin: 4px 0 6px; }
  figcaption a { color: var(--muted); font-size: 12px; }
  figcaption a:hover { color: var(--ink); }
  @media (max-width: 520px) {
    header { padding-top: 28px; }
    h1 { font-size: 26px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .card { padding: 10px; }
    .tile { width: 40px; height: 40px; padding: 7px; border-radius: 10px; }
    figcaption p { display: none; }
  }
</style>
</head>
<body data-bg="cream">
<header>
  <h1>Lava · memory icons</h1>
  <p>Twenty liquid marks for Lava. Blobs melt into each other, acid eats holes into them, and each one keeps
    a circle or a star as the memory it holds. Every SVG is a single editable path that takes its colour from
    <code>currentColor</code>.</p>
  <div class="controls">
    <div class="seg" role="group" aria-label="Style">
      <button data-filter="all" aria-pressed="true">All</button>
      <button data-filter="fill" aria-pressed="false">Filled</button>
      <button data-filter="line" aria-pressed="false">Outline</button>
    </div>
    <div class="seg" role="group" aria-label="Weight">
      <button data-weight="regular" aria-pressed="true">Regular</button>
      <button data-weight="bold" aria-pressed="false">Bold</button>
    </div>
    <div class="seg" role="group" aria-label="Background">
      <button data-bg="cream" aria-pressed="true">Cream</button>
      <button data-bg="white" aria-pressed="false">White</button>
      <button data-bg="ink" aria-pressed="false">Ink</button>
    </div>
  </div>
</header>

<!-- icons:end -->
<script>
  function press(group, btn) {
    group.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === btn)));
  }
  document.querySelectorAll('button[data-filter]').forEach(btn => btn.addEventListener('click', () => {
    press(btn.parentElement, btn);
    document.querySelectorAll('.card').forEach(c => {
      c.hidden = btn.dataset.filter !== 'all' && c.dataset.kind !== btn.dataset.filter;
    });
  }));
  document.querySelectorAll('button[data-weight]').forEach(btn => btn.addEventListener('click', () => {
    press(btn.parentElement, btn);
    const bold = btn.dataset.weight === 'bold';
    document.querySelectorAll('.card').forEach(card => {
      const name = card.querySelector('a');
      name.href = name.getAttribute('href').replace(/svg\/(bold\/)?/, bold ? 'svg/bold/' : 'svg/');
    });
    document.querySelectorAll('.card use').forEach(u => {
      u.setAttribute('href', u.getAttribute('href').replace(/#[ib]/, bold ? '#b' : '#i'));
    });
  }));
  document.querySelectorAll('button[data-bg]').forEach(btn => btn.addEventListener('click', () => {
    press(btn.parentElement, btn);
    document.body.dataset.bg = btn.dataset.bg;
  }));
</script>
